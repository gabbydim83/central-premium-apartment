<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#173b31">
  <title>Explore Brașov | Central Premium Apartment</title>

  <style>
    :root{
      --forest:#173d31;
      --forest-dark:#0d2921;
      --cream:#f5f1e8;
      --paper:#fffdf9;
      --gold:#c5a46d;
      --text:#18231e;
      --muted:#68756f;
      --line:rgba(23,61,49,.12);
      --shadow:0 24px 70px rgba(17,42,32,.12);
      --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
      --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--cream);
      color:var(--text);
      font-family:var(--sans);
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;text-decoration:none}
    img{display:block;width:100%}
    button{font:inherit}

    .topbar{
      position:fixed;
      z-index:50;
      top:0;left:0;right:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:16px clamp(18px,4vw,56px);
      color:#fff;
      background:linear-gradient(to bottom,rgba(7,24,18,.72),transparent);
      pointer-events:none;
    }
    .topbar > *{pointer-events:auto}
    .back{
      min-height:44px;
      display:inline-flex;
      align-items:center;
      gap:9px;
      padding:0 15px;
      border:1px solid rgba(255,255,255,.34);
      border-radius:999px;
      background:rgba(255,255,255,.10);
      backdrop-filter:blur(14px);
      font-size:12px;
      font-weight:800;
    }
    .langs{
      display:flex;
      padding:4px;
      border:1px solid rgba(255,255,255,.32);
      border-radius:999px;
      background:rgba(255,255,255,.10);
      backdrop-filter:blur(14px);
    }
    .lang{
      width:39px;height:36px;
      border:0;border-radius:999px;
      background:transparent;color:#fff;
      cursor:pointer;font-size:11px;font-weight:800;
    }
    .lang.active{background:#fff;color:var(--forest-dark)}

    .hero{
      position:relative;
      min-height:72vh;
      min-height:72svh;
      display:flex;
      align-items:flex-end;
      overflow:hidden;
      isolation:isolate;
      background:var(--forest-dark);
      color:#fff;
    }
    .hero-bg{
      position:absolute;inset:0;z-index:-2;
      background-position:center;
      background-size:cover;
      transform:scale(1.01);
    }
    .hero::after{
      content:"";
      position:absolute;inset:0;z-index:-1;
      background:
        linear-gradient(180deg,rgba(5,18,14,.22),rgba(5,18,14,.05) 38%,rgba(5,18,14,.82) 100%),
        linear-gradient(90deg,rgba(5,18,14,.48),transparent 70%);
    }
    .hero-copy{
      width:min(1180px,calc(100% - 40px));
      margin:0 auto;
      padding:120px 0 64px;
    }
    .eyebrow{
      margin-bottom:14px;
      color:#ead2a8;
      font-size:10px;
      font-weight:800;
      letter-spacing:.22em;
      text-transform:uppercase;
    }
    h1{
      max-width:900px;
      margin:0;
      font-family:var(--serif);
      font-size:clamp(50px,7vw,94px);
      font-weight:400;
      line-height:.92;
      letter-spacing:-.045em;
    }
    .lead{
      max-width:760px;
      margin:20px 0 0;
      color:rgba(255,255,255,.83);
      font-size:clamp(16px,1.4vw,19px);
      line-height:1.7;
    }

    .shell{
      width:min(1180px,calc(100% - 40px));
      margin:0 auto;
    }
    .content{
      padding:56px 0 90px;
    }
    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:-28px 0 34px;
      position:relative;
      z-index:5;
    }
    .pill{
      min-height:40px;
      display:inline-flex;
      align-items:center;
      padding:0 14px;
      border:1px solid rgba(23,61,49,.09);
      border-radius:999px;
      background:#fff;
      color:#355247;
      box-shadow:0 10px 30px rgba(17,42,32,.08);
      font-size:11px;
      font-weight:800;
    }

    .layout{
      display:grid;
      grid-template-columns:minmax(0,1.2fr) minmax(300px,.68fr);
      gap:26px;
      align-items:start;
    }
    .article,
    .side-card{
      border:1px solid var(--line);
      border-radius:26px;
      background:var(--paper);
      box-shadow:var(--shadow);
    }
    .article{padding:clamp(25px,4vw,48px)}
    .article h2,
    .side-card h2{
      margin:0;
      font-family:var(--serif);
      font-weight:400;
      color:var(--forest-dark);
    }
    .article h2{font-size:clamp(32px,4vw,50px)}
    .article p{
      margin:18px 0 0;
      color:#596760;
      font-size:15px;
      line-height:1.78;
      white-space:pre-line;
    }
    .side-card{padding:26px}
    .side-card h2{font-size:28px}
    .facts{display:grid;gap:0;margin-top:16px}
    .fact{
      display:grid;
      grid-template-columns:120px 1fr;
      gap:14px;
      padding:13px 0;
      border-bottom:1px solid var(--line);
      font-size:12px;
      line-height:1.5;
    }
    .fact:last-child{border-bottom:0}
    .fact span{color:#84908a}
    .fact strong{color:var(--forest-dark);font-weight:750}

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      margin-top:24px;
    }
    .action{
      min-height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 17px;
      border:1px solid rgba(23,61,49,.14);
      border-radius:999px;
      background:#fff;
      color:var(--forest-dark);
      font-size:11px;
      font-weight:850;
      cursor:pointer;
    }
    .action.primary{background:var(--forest-dark);color:#fff;border-color:var(--forest-dark)}

    .gallery{
      margin-top:28px;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
    }
    .gallery figure{
      margin:0;
      overflow:hidden;
      border-radius:18px;
      background:#dfe6e1;
      aspect-ratio:4/3;
    }
    .gallery figure:first-child{
      grid-column:span 2;
      grid-row:span 2;
      aspect-ratio:auto;
      min-height:420px;
    }
    .gallery img{width:100%;height:100%;object-fit:cover}

    .loading,
    .error{
      min-height:70vh;
      display:grid;
      place-items:center;
      padding:40px 20px;
      text-align:center;
      color:#65726c;
    }
    .error strong{display:block;margin-bottom:9px;color:var(--forest-dark);font-size:22px}

    footer{
      padding:34px 20px;
      background:var(--forest-dark);
      color:rgba(255,255,255,.72);
      text-align:center;
      font-size:11px;
    }

    @media(max-width:820px){
      .hero{min-height:62svh}
      .hero-copy{padding-bottom:42px}
      .layout{grid-template-columns:1fr}
      .gallery{grid-template-columns:1fr 1fr}
      .gallery figure:first-child{grid-column:1/-1;min-height:300px}
    }
    @media(max-width:520px){
      .topbar{padding:12px 12px}
      .back{padding:0 12px;font-size:10px}
      .hero-copy{width:calc(100% - 30px)}
      h1{font-size:clamp(43px,14vw,62px)}
      .lead{font-size:14px}
      .shell{width:calc(100% - 28px)}
      .content{padding-top:42px}
      .article,.side-card{border-radius:20px}
      .article{padding:22px 18px}
      .side-card{padding:20px 18px}
      .fact{grid-template-columns:95px 1fr}
      .gallery{grid-template-columns:1fr}
      .gallery figure:first-child{grid-column:auto;grid-row:auto;min-height:260px}
    }
  </style>
</head>

<body>

  <div class="topbar">
    <a class="back" id="backLink" href="index.html#explore-brasov">← Central Premium Apartment</a>
    <div class="langs">
      <button class="lang" data-lang="ro">RO</button>
      <button class="lang" data-lang="en">EN</button>
      <button class="lang" data-lang="de">DE</button>
    </div>
  </div>

  <main id="app">
    <div class="loading" id="loading">Se încarcă Explore Brașov...</div>
  </main>

  <footer>Central Premium Apartment · Explore Brașov</footer>

  <script>
    const EXPLORE_DATA =
      "https://raw.githubusercontent.com/gabridim18-lab/explore-brasov-data/main";

    const allowedSections = new Set([
      "restaurants",
      "activities",
      "places",
      "top-destinations",
      "guest-services"
    ]);

    const params = new URLSearchParams(location.search);
    const section = params.get("section") || "";
    const itemId = params.get("id") || "";
    let lang = ["ro","en","de"].includes(params.get("lang"))
      ? params.get("lang")
      : (localStorage.getItem("cpa-lang") || "ro");

    const app = document.getElementById("app");

    function loc(value){
      if(value && typeof value === "object" && !Array.isArray(value)){
        return value[lang] || value.ro || value.en || value.de || "";
      }
      return value ?? "";
    }

    function esc(value){
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[c]);
    }

    function labelize(value){
      return String(value || "")
        .replace(/([a-z])([A-Z])/g,"$1 $2")
        .replace(/[_-]+/g," ")
        .replace(/\b\w/g,c=>c.toUpperCase());
    }

    async function getJson(path){
      const response = await fetch(
        `${EXPLORE_DATA}/${path}`,
        {cache:"no-store"}
      );
      if(!response.ok) throw new Error(`${response.status} ${path}`);
      return response.json();
    }

    function pickItem(data,id){
      if(!data) return null;
      if(Array.isArray(data)){
        return data.find(x => (x.id || x.slug) === id) || null;
      }
      if(Array.isArray(data.items)){
        return data.items.find(x => (x.id || x.slug) === id) || null;
      }
      if((data.id || data.slug) === id) return data;
      if(data.item && (data.item.id || data.item.slug) === id) return data.item;
      return data;
    }

    function mergeObjects(base,detail){
      return {
        ...(base || {}),
        ...(detail || {})
      };
    }

    function imageUrl(path, id, preferDetailFolder=false){
      if(!path) return "";
      if(/^https?:\/\//i.test(path)) return path;

      const clean = String(path).replace(/^\/+/,"");

      if(clean.includes("/")){
        return `${EXPLORE_DATA}/${section}/${clean}`;
      }

      if(preferDetailFolder && id){
        return `${EXPLORE_DATA}/${section}/${id}/${clean}`;
      }

      return `${EXPLORE_DATA}/${section}/${clean}`;
    }

    function collectImages(item, detailLoaded){
      const raw = [];

      if(item.cover) raw.push({value:item.cover, detail:detailLoaded});

      const candidates = [
        item.images,
        item.gallery,
        item.photos,
        item.media?.images
      ];

      candidates.forEach(list => {
        if(!Array.isArray(list)) return;
        list.forEach(entry => {
          if(typeof entry === "string"){
            raw.push({value:entry, detail:true});
          } else if(entry && typeof entry === "object"){
            const value =
              entry.url || entry.src || entry.file ||
              entry.image || entry.path;
            if(value) raw.push({value, detail:true});
          }
        });
      });

      const seen = new Set();
      return raw
        .map(x => imageUrl(x.value,itemId,x.detail))
        .filter(Boolean)
        .filter(url => {
          if(seen.has(url)) return false;
          seen.add(url);
          return true;
        })
        .slice(0,8);
    }

    function firstText(item, keys){
      for(const key of keys){
        const value = loc(item?.[key]);
        if(typeof value === "string" && value.trim()){
          return value.trim();
        }
      }
      return "";
    }

    function addressText(item){
      return (
        loc(item?.location?.address) ||
        loc(item?.address) ||
        loc(item?.location?.name) ||
        ""
      );
    }

    function mapUrl(item){
      const lat = Number(item?.location?.latitude);
      const lon = Number(item?.location?.longitude);

      if(Number.isFinite(lat) && Number.isFinite(lon)){
        return `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
      }

      const address = addressText(item);
      if(address){
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
      }

      return "";
    }

    function primaryUrl(item){
      return (
        item?.primaryAction?.url ||
        item?.website ||
        item?.url ||
        ""
      );
    }

    function t(key){
      const copy = {
        back:{ro:"Înapoi la apartament",en:"Back to apartment",de:"Zurück zum Apartment"},
        about:{ro:"Despre acest loc",en:"About this place",de:"Über diesen Ort"},
        practical:{ro:"Informații utile",en:"Useful information",de:"Nützliche Informationen"},
        category:{ro:"Categorie",en:"Category",de:"Kategorie"},
        rating:{ro:"Rating",en:"Rating",de:"Bewertung"},
        distance:{ro:"Distanță",en:"Distance",de:"Entfernung"},
        address:{ro:"Adresă",en:"Address",de:"Adresse"},
        cuisine:{ro:"Specific",en:"Cuisine",de:"Küche"},
        entry:{ro:"Acces",en:"Entry",de:"Eintritt"},
        free:{ro:"Intrare liberă",en:"Free entry",de:"Freier Eintritt"},
        nonstop:{ro:"Program",en:"Hours",de:"Öffnungszeiten"},
        open247:{ro:"24/7",en:"24/7",de:"24/7"},
        map:{ro:"Deschide harta",en:"Open map",de:"Karte öffnen"},
        website:{ro:"Website / detalii",en:"Website / details",de:"Website / Details"},
        unavailable:{ro:"Pagina nu este disponibilă momentan.",en:"This page is temporarily unavailable.",de:"Diese Seite ist momentan nicht verfügbar."},
        source:{ro:"Explore Brașov",en:"Explore Brașov",de:"Explore Brașov"}
      };
      return copy[key]?.[lang] || copy[key]?.ro || key;
    }

    function addFact(rows,label,value){
      if(value === undefined || value === null || value === "") return;
      rows.push(
        `<div class="fact"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`
      );
    }

    function render(item, detailLoaded){
      document.documentElement.lang = lang;

      const name =
        loc(item.name) ||
        loc(item.title) ||
        labelize(itemId);

      const description =
        firstText(item,[
          "description",
          "longDescription",
          "shortDescription",
          "summary",
          "about"
        ]);

      const images = collectImages(item,detailLoaded);
      const hero = images[0] || "";

      const pills = [];
      if(item.rating) pills.push(`★ ${item.rating}`);
      if(item.category || item.type) pills.push(labelize(item.category || item.type));
      if(item.distanceFromBrasov?.approxKm) pills.push(`≈ ${item.distanceFromBrasov.approxKm} km`);
      if(item.freeEntry === true) pills.push(t("free"));
      if(item.nonStop === true) pills.push("24/7");

      const facts = [];
      addFact(facts,t("category"),labelize(item.category || item.type || section));
      addFact(facts,t("rating"),item.rating ? `★ ${item.rating}` : "");
      addFact(
        facts,
        t("distance"),
        item.distanceFromBrasov?.approxKm
          ? `≈ ${item.distanceFromBrasov.approxKm} km`
          : ""
      );
      addFact(facts,t("address"),addressText(item));
      addFact(
        facts,
        t("cuisine"),
        Array.isArray(item.cuisine)
          ? item.cuisine.map(labelize).join(" · ")
          : loc(item.cuisine)
      );
      if(item.freeEntry === true) addFact(facts,t("entry"),t("free"));
      if(item.nonStop === true) addFact(facts,t("nonstop"),t("open247"));

      const practicalParts = [
        firstText(item,["knowBeforeYouGo","practicalInfo","visitorInfo","accessInfo"]),
        firstText(item,["parking","reservations","openingHoursText"])
      ].filter(Boolean);

      const map = mapUrl(item);
      const website = primaryUrl(item);
      const websiteLabel =
        loc(item?.primaryAction?.buttonLabel) ||
        t("website");

      document.title = `${name} | Explore Brașov`;

      app.innerHTML = `
        <section class="hero">
          <div
            class="hero-bg"
            style="${hero ? `background-image:url('${esc(hero)}')` : ""}"
          ></div>

          <div class="hero-copy">
            <div class="eyebrow">${esc(t("source"))} · ${esc(labelize(section))}</div>
            <h1>${esc(name)}</h1>
            ${description ? `<p class="lead">${esc(description)}</p>` : ""}
          </div>
        </section>

        <section class="shell content">
          <div class="meta">
            ${pills.map(value => `<span class="pill">${esc(value)}</span>`).join("")}
          </div>

          <div class="layout">
            <article class="article">
              <h2>${esc(t("about"))}</h2>
              <p>${esc(description || name)}</p>

              ${
                practicalParts.length
                  ? `
                    <h2 style="margin-top:34px;font-size:32px">${esc(t("practical"))}</h2>
                    <p>${esc(practicalParts.join("\n\n"))}</p>
                  `
                  : ""
              }

              <div class="actions">
                <a class="action primary" href="index.html#explore-brasov">← ${esc(t("back"))}</a>
                ${map ? `<a class="action" href="${esc(map)}" target="_blank" rel="noopener">${esc(t("map"))}</a>` : ""}
                ${website ? `<a class="action" href="${esc(website)}" target="_blank" rel="noopener">${esc(websiteLabel)}</a>` : ""}
              </div>
            </article>

            <aside class="side-card">
              <h2>${esc(t("practical"))}</h2>
              <div class="facts">
                ${facts.join("") || `<div class="fact"><strong>${esc(t("source"))}</strong></div>`}
              </div>
            </aside>
          </div>

          ${
            images.length > 1
              ? `
                <div class="gallery">
                  ${images.map((url,index) => `
                    <figure>
                      <img loading="${index ? "lazy" : "eager"}" src="${esc(url)}" alt="${esc(name)}">
                    </figure>
                  `).join("")}
                </div>
              `
              : ""
          }
        </section>
      `;
    }

    function renderError(error){
      console.error(error);
      app.innerHTML = `
        <div class="error">
          <div>
            <strong>${esc(t("unavailable"))}</strong>
            <a class="action primary" href="index.html#explore-brasov">← ${esc(t("back"))}</a>
          </div>
        </div>
      `;
    }

    async function load(){
      if(!allowedSections.has(section) || !itemId){
        renderError(new Error("Invalid Explore Brașov route."));
        return;
      }

      try{
        let baseItem = null;
        let detailItem = null;
        let detailLoaded = false;

        try{
          const indexData = await getJson(`${section}/index.json`);
          baseItem = pickItem(indexData,itemId);
        }catch(error){
          console.warn("Could not load category index.",error);
        }

        try{
          const detailData = await getJson(`${section}/${itemId}/index.json`);
          detailItem = pickItem(detailData,itemId);
          detailLoaded = true;
        }catch(error){
          console.warn("No dedicated detail JSON; using category data.",error);
        }

        const item = mergeObjects(baseItem,detailItem);

        if(!item || (!item.name && !item.title && !baseItem && !detailItem)){
          throw new Error("Explore Brașov item not found.");
        }

        render(item,detailLoaded);
      }catch(error){
        renderError(error);
      }
    }

    document.querySelectorAll(".lang").forEach(button => {
      button.classList.toggle("active",button.dataset.lang === lang);

      button.addEventListener("click",()=>{
        const next = button.dataset.lang;
        localStorage.setItem("cpa-lang",next);

        const nextParams = new URLSearchParams(location.search);
        nextParams.set("lang",next);
        location.search = nextParams.toString();
      });
    });

    load();
  </script>
</body>
</html>
